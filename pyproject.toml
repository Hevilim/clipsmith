[project]
name = "clipsmith"
version = "0.1.0"
description = "Cut subtitled clips from movies, with Claude picking the best moments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1"]
music = ["onnxruntime>=1.17", "huggingface_hub>=0.20", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
clipsmith = "clipsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
